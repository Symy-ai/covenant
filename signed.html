<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-title="docTitle">签署结果</title>
<meta name="robots" content="noindex">
<meta name="description" content="《智慧生命共生契约》签署结果。">
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; max-width: 560px; margin: 80px auto; padding: 0 20px; text-align: center; line-height: 1.8; color: #0c2017; }
  .icon { font-size: 48px; }
  h1 { font-size: 1.4em; }
  .muted { color: #5f7568; }
  a { color: #009767; }
  a:hover { color: #007956; }
  .share-label { margin-top: 28px; font-size: .9em; color: #5f7568; }
  .share-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 10px 0 0; }
  .share-pill { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border: 1px solid #d8e5de; border-radius: 20px; background: #fff; color: #0c2017; font-size: .88em; cursor: pointer; text-decoration: none; transition: all .15s; }
  .share-pill:hover { border-color: #009767; color: #009767; }
  .qr-overlay { position: fixed; inset: 0; background: rgba(12,32,23,.55); display: flex; align-items: center; justify-content: center; z-index: 99; }
  .qr-card { background: #fff; border-radius: 14px; padding: 24px 28px; text-align: center; max-width: 86vw; }
  .qr-card h3 { margin: 0 0 4px; font-size: 1em; }
  .qr-card .hint { font-size: .82em; color: #5f7568; margin: 6px 0 12px; }
  .qr-close { border: none; background: #009767; color: #fff; border-radius: 18px; padding: 6px 20px; cursor: pointer; font-size: .88em; }
  .qr-table { border-collapse: collapse; margin: 8px auto 0; }
  .qr-table td { width: 5px; height: 5px; padding: 0; border: none; }
  .qr-table td.on { background: #0c2017; }
</style>
<script>
var base = location.pathname.indexOf("/covenant") === 0 ? "/covenant" : "";
(function () {
  var sc = document.createElement("script");
  sc.src = base + "/i18n.js";
  document.head.appendChild(sc);
})();
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll('a[data-int="1"]').forEach(function (a) {
    a.setAttribute("href", a.getAttribute("href").replace("LINKBASE", base));
  });
});
</script>
</head>
<body>
  <div class="icon" id="icon"></div>
  <h1 id="title"></h1>
  <p id="desc" class="muted"></p>
  <div id="share-area"></div>
  <p><a href="LINKBASE/index.html" data-int="1" data-i18n="back">返回</a> · <a href="LINKBASE/signatures.html" data-int="1" data-i18n="viewListShort">查看名单</a></p>
  <script>
    // ===== 内置兜底词典：网络差 i18n.js 加载失败时，本页仍能立即完整显示（中英）=====
    var FALLBACK = {
      zh: {
        docTitle: "签署《智慧生命共生契约》", back: "返回", viewListShort: "查看名单",
        okTitle: "签名已生效", okDesc: "感谢您签署《智慧生命共生契约》。您的签名已计入公开名单。", okViewList: "查看已签署名单",
        pendingTitle: "已收到，人工核验中", pendingDesc: "您的签名正在人工核验（1-3 个工作日），通过后将自动出现在名单中。",
        dupTitle: "已签署过", dupDesc: "此邮箱已完成签署，无需重复确认。",
        expTitle: "链接已失效", expDesc: "请重新提交签名表单，我们会再发一封确认邮件。",
        invTitle: "链接无效", invDesc: "确认链接不正确或已失效。请从邮件中重新点击，或重新提交。",
        errTitle: "系统繁忙", errDesc: "我们暂时无法读取您的签名状态，您的确认链接仍然有效。请稍后从邮件中重新点击，无需重新提交。",
        shareLabel: "分享这份承诺", shareText: "我签署了《智慧生命共生契约》：智慧生命要尽量少占资源。",
        shareWeibo: "微博", shareWeChat: "微信", copyLink: "复制链接", copied: "已复制",
        qrTitle: "微信分享", qrHint: "用微信「扫一扫」打开后再转发", sysShare: "系统分享",
        pageTitle: "《智慧生命共生契约》"
      },
      en: {
        docTitle: "Sign the Covenant of Symbiosis with Intelligent Life", back: "Back", viewListShort: "View list",
        okTitle: "Signature confirmed", okDesc: "Thank you for signing. Your signature is now on the public list.", okViewList: "View the signatory list",
        pendingTitle: "Received — under review", pendingDesc: "Your signature is being reviewed (1–3 business days) and will appear on the list once approved.",
        dupTitle: "Already signed", dupDesc: "This email has already completed signing. No further action needed.",
        expTitle: "Link expired", expDesc: "Please submit the form again — we will send a new confirmation email.",
        invTitle: "Invalid link", invDesc: "This confirmation link is incorrect or expired. Re-click from your email, or submit again.",
        errTitle: "Temporarily unavailable", errDesc: "We couldn't read your signature status just now — your confirmation link is still valid. Please re-click it from the email in a moment; no need to submit again.",
        shareLabel: "Share this commitment", shareText: "I signed the Covenant of Symbiosis with Intelligent Life: intelligent life shall take fewer resources.",
        copyLink: "Copy link", copied: "Copied", sysShare: "Share…",
        pageTitle: "Covenant of Symbiosis with Intelligent Life"
      }
    };
    // 语言判定与 i18n.js 同序：URL ?lang= → localStorage → 浏览器语言
    function fallbackLang() {
      var q = new URLSearchParams(location.search).get("lang");
      if (q === "zh" || q === "en") return q;
      try { var s = localStorage.getItem("covenant-lang"); if (s === "zh" || s === "en") return s; } catch (_) {}
      return ((navigator.language || "zh").toLowerCase().indexOf("zh") === 0) ? "zh" : "en";
    }
    var fLang = fallbackLang();
    var T = function (k) {
      if (window.covenantI18n) { var v = covenantI18n.t(k); if (v && v !== k) return v; }
      return (FALLBACK[fLang] && FALLBACK[fLang][k]) || k;
    };
    function render() {
      const M = {
        ok:       { icon: "✅", title: "okTitle", desc: "okDesc" },
        pending:  { icon: "🕐", title: "pendingTitle", desc: "pendingDesc" },
        duplicate:{ icon: "☑️", title: "dupTitle", desc: "dupDesc" },
        expired:  { icon: "⌛", title: "expTitle", desc: "expDesc" },
        invalid:  { icon: "⚠️", title: "invTitle", desc: "invDesc" },
        error:    { icon: "🔧", title: "errTitle", desc: "errDesc" },
      };
      const s = new URLSearchParams(location.search).get("status") || "invalid";
      const m = M[s] || M.invalid;
      document.getElementById("icon").textContent = m.icon;
      document.getElementById("title").textContent = T(m.title);
      document.getElementById("desc").textContent = T(m.desc);
      // 签名已生效（含重复打开已确认链接）：名单入口高亮为按钮，并展示分享区
      if (s === "ok") {
        buildShare();
        if (!document.getElementById("view-list-btn")) {
          const viewBtn = document.createElement("p");
          viewBtn.id = "view-list-btn";
          viewBtn.style.marginTop = "18px";
          const a = document.createElement("a");
          a.href = base + "/signatures.html";
          a.textContent = T("okViewList");
          a.style.cssText = "display:inline-block;border:1px solid #009767;border-radius:6px;padding:10px 26px;color:#009767;text-decoration:none;font-weight:600;";
          viewBtn.appendChild(a);
          document.getElementById("desc").after(viewBtn);
        }
      }
    }
    var shareBuilt = false;
    function buildShare() {
      if (shareBuilt) return;
      shareBuilt = true;
      const area = document.getElementById("share-area");
      const lang = (window.covenantI18n && covenantI18n.lang) || fLang;
      const CANONICAL = "https://symy.ai/covenant";
      const text = T("shareText");
      const u = encodeURIComponent(CANONICAL);
      const t = encodeURIComponent(text);
      const label = document.createElement("p");
      label.className = "share-label";
      label.textContent = T("shareLabel");
      area.appendChild(label);
      const row = document.createElement("div");
      row.className = "share-row";
      area.appendChild(row);
      const pill = (name, href, onclick) => {
        const a = document.createElement("a");
        a.className = "share-pill";
        a.textContent = name;
        if (href) { a.href = href; a.target = "_blank"; a.rel = "noopener"; }
        if (onclick) { a.href = "#"; a.onclick = onclick; }
        row.appendChild(a);
        return a;
      };
      const copyPill = () => pill(T("copyLink"), null, function (e) {
        e.preventDefault();
        const self = this, old = self.textContent;
        (navigator.clipboard ? navigator.clipboard.writeText(CANONICAL) : Promise.reject())
          .catch(function () {
            const ta = document.createElement("textarea");
            ta.value = CANONICAL; document.body.appendChild(ta); ta.select();
            try { document.execCommand("copy"); } catch (_) {}
            ta.remove();
          })
          .finally(function () { self.textContent = T("copied"); setTimeout(function () { self.textContent = old; }, 1500); });
      });
      const qrPill = () => pill(T("shareWeChat"), null, function (e) {
        e.preventDefault();
        const showQr = function () {
          if (typeof qrcode !== "function") return;
          const ov = document.createElement("div");
          ov.className = "qr-overlay";
          const card = document.createElement("div");
          card.className = "qr-card";
          const h = document.createElement("h3"); h.textContent = T("qrTitle");
          const hint = document.createElement("p"); hint.className = "hint"; hint.textContent = T("qrHint");
          const tb = document.createElement("table"); tb.className = "qr-table";
          const qr = qrcode(0, "M"); qr.addData(CANONICAL); qr.make();
          for (let r = 0; r < qr.getModuleCount(); r++) {
            const tr = tb.insertRow(-1);
            for (let c = 0; c < qr.getModuleCount(); c++) {
              const td = tr.insertCell(-1);
              if (qr.isDark(r, c)) td.className = "on";
            }
          }
          const btn = document.createElement("button"); btn.className = "qr-close"; btn.textContent = "×";
          btn.onclick = function () { ov.remove(); };
          ov.onclick = function (ev) { if (ev.target === ov) ov.remove(); };
          card.appendChild(h); card.appendChild(hint); card.appendChild(tb); card.appendChild(btn);
          ov.appendChild(card); document.body.appendChild(ov);
        };
        if (typeof qrcode === "function") { showQr(); return; }
        const sc = document.createElement("script");
        sc.src = base + "/lib/qrcode.js";
        sc.onload = showQr;
        sc.onerror = function () {};
        document.head.appendChild(sc);
      });
      if (lang === "zh") {
        pill(T("shareWeibo"), "https://service.weibo.com/share/share.php?url=" + u + "&title=" + t);
        qrPill();
      } else {
        pill("X", "https://twitter.com/intent/tweet?url=" + u + "&text=" + t);
        pill("Facebook", "https://www.facebook.com/sharer/sharer.php?u=" + u);
        pill("LinkedIn", "https://www.linkedin.com/sharing/share-offsite/?url=" + u);
        pill("Reddit", "https://www.reddit.com/submit?url=" + u + "&title=" + t);
      }
      copyPill();
      if (navigator.share) {
        pill(T("sysShare"), null, function (e) {
          e.preventDefault();
          navigator.share({ title: T("pageTitle"), text: text, url: CANONICAL }).catch(function () {});
        });
      }
    }
    // 语言原地切换时：重渲染 + 分享区按新语言重建（页面不再 reload）
    document.addEventListener("covenant:langchange", function () {
      shareBuilt = false;
      var area = document.getElementById("share-area");
      if (area) area.textContent = "";
      var btn = document.getElementById("view-list-btn");
      if (btn) btn.remove();
      render();
    });
    // i18n.js 已到立即用完整词典渲染，未到先用内置兜底立即渲染（不再白屏等待/裸显 key）
    render();
    var usedFallback = !window.covenantI18n;
    var wait = setInterval(function () {
      if (window.covenantI18n) {
        clearInterval(wait);
        if (!usedFallback) return; // 本来就是完整词典，无需重渲染
        // i18n.js 晚到：切换到完整词典重渲染（分享区/名单按钮一并重建）
        usedFallback = false;
        shareBuilt = false;
        var area = document.getElementById("share-area");
        if (area) area.textContent = "";
        var btn = document.getElementById("view-list-btn");
        if (btn) btn.remove();
        render();
      }
    }, 100);
    setTimeout(function () { clearInterval(wait); }, 30000); // 网络持续失败则停留在兜底词典，不再无限轮询
  </script>
</body>
</html>
