<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-title>签署结果</title>
<script src="i18n.js"></script>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; max-width: 560px; margin: 80px auto; padding: 0 20px; text-align: center; line-height: 1.8; color: #111; }
  .icon { font-size: 48px; }
  h1 { font-size: 1.4em; }
  .muted { color: #666; }
  a { color: #6a1b9a; }
</style>
<script>
(function () {
  var base = location.pathname.indexOf("/covenant") === 0 ? "/covenant" : "";
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll('a[data-int="1"]').forEach(function (a) {
      a.setAttribute("href", a.getAttribute("href").replace("LINKBASE", base));
    });
  });
})();
</script>
</head>
<body>
  <div class="icon" id="icon"></div>
  <h1 id="title"></h1>
  <p id="desc" class="muted"></p>
  <p><a href="LINKBASE/index.html" data-int="1" data-i18n>back</a> · <a href="LINKBASE/signatures.html" data-int="1" data-i18n>viewListShort</a></p>
  <script>
    var T = function (k) { return window.covenantI18n ? covenantI18n.t(k) : k; };
    const M = {
      ok:       { icon: "✅", title: "okTitle", desc: "okDesc" },
      pending:  { icon: "🕐", title: "pendingTitle", desc: "pendingDesc" },
      duplicate:{ icon: "☑️", title: "dupTitle", desc: "dupDesc" },
      expired:  { icon: "⌛", title: "expTitle", desc: "expDesc" },
      invalid:  { icon: "⚠️", title: "invTitle", desc: "invDesc" },
    };
    const s = new URLSearchParams(location.search).get("status") || "invalid";
    const m = M[s] || M.invalid;
    document.getElementById("icon").textContent = m.icon;
    document.getElementById("title").textContent = T(m.title);
    document.getElementById("desc").textContent = T(m.desc);
  </script>
</body>
</html>
