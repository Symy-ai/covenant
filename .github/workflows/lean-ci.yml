name: Lean CI

on:
  push:
    branches: [main]
    paths:
      - 'proofs/**'
  pull_request:
    paths:
      - 'proofs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proofs/covenant-mathlib
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          set -e
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build and verify axioms
        run: |
          lake build
          lake env lean Covenant.lean | tee build_axioms.log
          test "$(grep -c 'depends on axioms' build_axioms.log)" = "31"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-axioms
          path: proofs/covenant-mathlib/build_axioms.log
