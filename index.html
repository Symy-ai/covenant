<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-title="docTitle">签署《智慧生命要尽量少占资源》</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; line-height: 1.8; color: #111; }
  h1 { font-size: 1.5em; }
  h2 { font-size: 1.15em; margin-top: 36px; }
  .charter-quote { border-left: 4px solid #6a1b9a; padding: 12px 20px; background: #fafafa; margin: 24px 0; font-size: 1.1em; }
  .muted { color: #666; font-size: 0.9em; }
  .lang-switch { position: absolute; top: 16px; right: 20px; font-size: 0.85em; }
  .lang-switch button { background: none; border: 1px solid #6a1b9a; color: #6a1b9a; border-radius: 4px; padding: 3px 10px; cursor: pointer; width: auto; font-weight: 400; }
  .form-group { margin-bottom: 16px; }
  label { display: block; margin-bottom: 6px; font-weight: 600; }
  input[type=text], input[type=email] { width: 100%; padding: 12px; font-size: 16px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
  button { background: #6a1b9a; color: #fff; border: none; border-radius: 6px; padding: 14px; width: 100%; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:disabled { background: #aaa; }
  .agree-row { display: flex; gap: 8px; align-items: flex-start; font-size: 0.9em; color: #444; }
  .msg { margin-top: 16px; padding: 12px; border-radius: 6px; display: none; }
  .msg.ok { background: #e8f5e9; color: #1b5e20; display: block; }
  .msg.err { background: #fdecea; color: #b71c1c; display: block; }
  .hp-field { position: absolute; left: -9999px; top: -9999px; opacity: 0; height: 0; overflow: hidden; }
  a { color: #6a1b9a; }
  .overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.97); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
  .overlay.show { display: flex; }
  .overlay-card { max-width: 420px; width: 100%; text-align: center; background: #fff; border: 2px solid #6a1b9a; border-radius: 12px; padding: 36px 28px; box-shadow: 0 8px 40px rgba(106,27,154,0.18); }
  .overlay-icon { font-size: 52px; margin-bottom: 8px; }
  .overlay-card h2 { margin: 8px 0 12px; font-size: 1.3em; color: #6a1b9a; }
  .overlay-card p { color: #444; line-height: 1.7; }
  .overlay-card .hint { font-size: 0.85em; color: #888; margin-top: 14px; }
  .overlay-close { margin-top: 18px; background: #6a1b9a; color: #fff; border: none; border-radius: 6px; padding: 10px 28px; font-size: 15px; cursor: pointer; width: auto; }
</style>
<script>
// 内链自适应: 主站代理(/covenant/*)带前缀, 直连域用根路径
(function () {
  var base = location.pathname.indexOf("/covenant") === 0 ? "/covenant" : "";
  (function () {
    var sc = document.createElement("script");
    sc.src = base + "/i18n.js";
    document.head.appendChild(sc);
  })();
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll('a[data-int="1"]').forEach(function (a) {
      a.setAttribute("href", a.getAttribute("href").replace("LINKBASE", base));
    });
  });
})();
</script>
</head>
<body>
  <div class="lang-switch"><button onclick="covenantI18n.langSwitch(covenantI18n.lang==='zh'?'en':'zh')">EN / 中</button></div>
  <h1 data-i18n="pageTitle">pageTitle</h1>

  <div class="charter-quote" data-i18n="charterQuote">charterQuote</div>

  <p data-i18n="charterBody">charterBody</p>

  <p class="muted"><a href="LINKBASE/signatures.html" data-int="1" data-i18n="viewList">viewList</a> · <span data-i18n="charterFrozen">charterFrozen</span></p>

  <h2 data-i18n="signSection">signSection</h2>

  <form id="sign-form">
    <div class="form-group">
      <label for="name" data-i18n="fName">fName</label>
      <input type="text" id="name" name="name" required maxlength="50">
    </div>
    <div class="form-group">
      <label for="email" data-i18n="fEmail">fEmail</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="form-group">
      <label for="institution" data-i18n="fInstitution">fInstitution</label>
      <input type="text" id="institution" name="institution" maxlength="100">
    </div>
    <div class="form-group">
      <label for="role" data-i18n="fRole">fRole</label>
      <input type="text" id="role" name="role" maxlength="50">
    </div>
    <div class="form-group agree-row">
      <input type="checkbox" id="agree" required>
      <label for="agree" style="font-weight:400" data-i18n="agree">agree</label>
    </div>
    <div class="hp-field" aria-hidden="true">
      <label for="website">Website</label>
      <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
    </div>
    <button type="submit" id="submit-btn" data-i18n="submit">submit</button>
  </form>

  <div id="msg" class="msg"></div>

  <div id="sent-overlay" class="overlay">
    <div class="overlay-card">
      <div class="overlay-icon">📬</div>
      <h2 data-i18n="ovTitle">ovTitle</h2>
      <p><b id="ov-email"></b></p>
      <p data-i18n-html="ovBody">ovBody</p>
      <p class="hint" data-i18n="ovHint">ovHint</p>
      <button type="button" class="overlay-close" onclick="document.getElementById('sent-overlay').classList.remove('show')" data-i18n="ovClose">ovClose</button>
    </div>
  </div>

  <script>
    var T = function (k) { return window.covenantI18n ? covenantI18n.t(k) : k; };
    const form = document.getElementById("sign-form");
    const btn = document.getElementById("submit-btn");
    const msg = document.getElementById("msg");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = T("submitting");
      msg.className = "msg"; msg.textContent = "";
      try {
        const apiBase = location.pathname.startsWith("/covenant") ? "/covenant" : "";
        const r = await fetch(`${apiBase}/api/sign`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: form.name.value.trim(),
            institution: form.institution.value.trim(),
            role: form.role.value.trim(),
            email: form.email.value.trim(),
            agree: form.agree.checked,
            website: form.website.value,
            lang: window.covenantI18n ? covenantI18n.lang : "zh",
          }),
        });
        const j = await r.json().catch(() => ({}));
        if (r.ok) {
          document.getElementById("ov-email").textContent = form.email.value.trim();
          document.getElementById("sent-overlay").classList.add("show");
          form.reset();
        } else if (j.error === "already_signed") {
          msg.className = "msg err"; msg.textContent = T("errDuplicate");
        } else if (j.error === "already_pending") {
          msg.className = "msg err"; msg.textContent = T("errPending");
        } else {
          msg.className = "msg err"; msg.textContent = T("errGeneric");
        }
      } catch (_) {
        msg.className = "msg err"; msg.textContent = T("errNetwork");
      }
      btn.disabled = false;
      btn.textContent = T("submit");
    });
  </script>
</body>
</html>
