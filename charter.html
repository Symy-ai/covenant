  <h1>《智慧生命要尽量少占资源》</h1>

  <p class="charter-quote">智慧生命要尽量少占资源。</p>

  <p>这不是对发展的否定，而是一种自我约束的自觉：在能达到同样目的的所有方式中，选择占用更少的那一种。算力、能源、注意力、他人的信任，皆是有限之物。智慧的生命不以挥霍证明自身，而以克制成就长久。我们无意规定任何人如何生活，只是愿意从自己开始，在每一次选择中多问一句：这件事，能否用更少的资源做成。</p>
