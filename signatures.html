<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; line-height: 1.8; color: #0c2017; }
  h1 { font-size: 1.4em; }

  .lang-switch button { background: none; border: 1px solid #009767; color: #009767; border-radius: 4px; padding: 3px 10px; cursor: pointer; width: auto; font-weight: 400; }
  .gh-link { position: absolute; top: 20px; right: 115px; display: inline-flex; align-items: center; }
  .gh-link svg { fill: #009767; opacity: 0.75; transition: opacity .15s; }

  .muted { color: #5f7568; font-size: 0.9em; }
  a { color: #009767; }
  a:hover { color: #007956; }
</style>
<script>
(function () {
  var base = location.pathname.indexOf("/covenant") === 0 ? "/covenant" : "";
  (function () {
    var sc = document.createElement("script");
    sc.src = base + "/i18n.js";
    document.head.appendChild(sc);
  })();
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll('a[data-int="1"]').forEach(function (a) {
      a.setAttribute("href", a.getAttribute("href").replace("LINKBASE", base));
    });
  });
})();
</script>
</head>
<body>
  <a class="gh-link" href="https://github.com/Symy-ai/covenant" target="_blank" rel="noopener" aria-label="GitHub 仓库" title="GitHub 仓库">
    <svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
  </a>
  <div class="lang-switch"><button onclick="covenantI18n.langSwitch(covenantI18n.lang==='zh'?'en':'zh')">EN / 中</button></div>
  <h1 data-i18n="listTitle">listTitle</h1>
  <p class="muted"><span data-i18n="listDesc">listDesc</span> <span id="loading" data-i18n="listLoading">listLoading</span></p>
  <table>
    <thead><tr><th data-i18n="thName">thName</th><th data-i18n="thInst">thInst</th><th data-i18n="thRole">thRole</th><th data-i18n="thDate">thDate</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p class="muted" style="margin-top:32px"><span data-i18n="listCountPre">listCountPre</span> <span class="count" id="count">…</span> <span data-i18n="listCountPost">listCountPost</span> · <a href="LINKBASE/index.html" data-int="1" data-i18n="iSign">iSign</a> · <a href="LINKBASE/charter.html" data-int="1" data-i18n="pageTitle">pageTitle</a></p>

  <script>
    var T = function (k) { return window.covenantI18n ? covenantI18n.t(k) : k; };
    // 主通道: 同源聚合端点(服务端拉数据, 绕开主站 CSP 对 jsdelivr/github 域名的拦截)
    // 兜底: 直连域(无 CSP)下若同源 API 网关不可用, 回退 CDN+GitHub 直连双通道
    const REPO = "symy-ai/covenant";
    const CDN = `https://cdn.jsdelivr.net/gh/${REPO}@main/signatures/verified`;
    const CDN_LIST = `https://data.jsdelivr.com/v1/packages/gh/${REPO}@main?structure=flat`;
    const RAW = `https://raw.githubusercontent.com/${REPO}/main/signatures/verified`;
    const LIST_API = `https://api.github.com/repos/${REPO}/contents/signatures/verified?ref=main`;
    const API_BASE = location.pathname.indexOf("/covenant") === 0 ? "/covenant" : "";

    async function loadRows() {
      const rows = new Map();
      const key = (x) => x.emailHash || x.name + "|" + (x.confirmedAt || "");

      // 主通道: 同源聚合
      try {
        const r = await fetch(`${API_BASE}/api/list?t=${Date.now()}`);
        if (!r.ok) throw new Error(r.status);
        const j = await r.json();
        for (const x of j.rows) rows.set(key(x), x);
        if (rows.size) return Array.from(rows.values());
      } catch (_) { /* 同源 API 不可用 → 走直连兜底 */ }

      async function loadCdn() {
        const r = await fetch(`${CDN_LIST}?t=${Date.now()}`);
        if (!r.ok) throw new Error(r.status);
        const pkg = await r.json();
        const names = pkg.files
          .map((f) => f.name.replace('/signatures/verified/', ''))
          .filter((n) => n.endsWith(".json"));
        if (!names.length) throw new Error("empty");
        return await Promise.all(names.map(async (n) => {
          const j = await (await fetch(`${CDN}/${n}?t=${Date.now()}`)).json();
          return j;
        }));
      }
      async function loadGithub() {
        const r = await fetch(`${LIST_API}&t=${Date.now()}`, { headers: { Accept: "application/vnd.github+json" } });
        if (!r.ok) throw new Error(r.status);
        const files = (await r.json()).filter((x) => x.type === "file" && x.name.endsWith(".json"));
        return await Promise.all(files.map(async (f) => {
          const j = await (await fetch(`${RAW}/${f.name}?t=${Date.now()}`)).json();
          return j;
        }));
      }

      try {
        for (const x of await loadCdn()) rows.set(key(x), x);
      } catch (_) { /* CDN 挂了走纯 GitHub */ }
      try {
        for (const x of await loadGithub()) rows.set(key(x), x);
      } catch (_) { /* 限流时 CDN 结果仍完整可用 */ }
      if (!rows.size) throw new Error("both-empty");
      return Array.from(rows.values());
    }

    (async () => {
      try {
        const rows = await loadRows();
        rows.sort((a, b) => (b.confirmedAt || "").localeCompare(a.confirmedAt || ""));
        document.getElementById("rows").innerHTML = rows.map((x) => {
          const commitLink = x.emailHash
            ? `https://github.com/${REPO}/commits/main/signatures/verified/${encodeURIComponent(x.emailHash)}.json`
            : null;
          const date = esc((x.confirmedAt || "").slice(0, 10));
          return `
          <tr><td>${esc(x.name)}</td><td>${esc(x.institution || "—")}</td><td>${esc(x.role || "")}</td><td>${commitLink ? `<a href="${commitLink}" target="_blank" rel="noopener" title="${esc(T("verifyHint"))}" aria-label="${esc(T("verifyHint"))}">${date} ↗</a>` : date}</td></tr>
        `;}).join("");
        document.getElementById("count").textContent = rows.length;
        document.getElementById("loading").textContent = "";
      } catch (_) {
        document.getElementById("loading").textContent = T("listLoadFail");
      }
    })();
    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
  </script>
</body>
</html>
