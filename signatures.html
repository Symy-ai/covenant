var COV_FB_LANG = (function () {

function covFbApply() {

  <p class="muted" style="margin-top:32px"><span data-i18n="listCountPre">共</span> <span class="count" id="count">…</span> <span data-i18n="listCountPost">位签署者</span> · <a href="LINKBASE/index.html" data-int="1" data-i18n="iSign">我要签署</a> · <a href="LINKBASE/charter.html" data-int="1" data-i18n="pageTitle">《智慧生命共生契约》</a></p>
  <p class="muted"><span data-i18n="listDescPrefix">备注：</span><span data-i18n="listDesc">名单读取公开仓库签名档案，每 5 分钟自动刷新；点击日期可核验该签名在 GitHub 上的提交记录。</span> <span id="updated-at" class="updated-at"></span> <span id="loading" data-i18n="listLoading">加载中…</span></p>

  <script>
    var T = function (k) { if (window.covenantI18n) { var v = covenantI18n.t(k); if (v && v !== k) return v; } return (COV_FB[COV_FB_LANG] && COV_FB[COV_FB_LANG][k]) || k; };
    // 主通道: 同源聚合端点(服务端拉数据, 绕开主站 CSP 对 jsdelivr/github 域名的拦截)
    // 兜底: 直连域(无 CSP)下若同源 API 网关不可用, 回退 CDN+GitHub 直连双通道
    const REPO = "symy-ai/covenant";
    const CDN = `https://cdn.jsdelivr.net/gh/${REPO}@main/signatures/verified`;
    const CDN_LIST = `https://data.jsdelivr.com/v1/packages/gh/${REPO}@main?structure=flat`;
    const RAW = `https://raw.githubusercontent.com/${REPO}/main/signatures/verified`;
    const LIST_API = `https://api.github.com/repos/${REPO}/contents/signatures/verified?ref=main`;
    const API_BASE = location.pathname.indexOf("/covenant") === 0 ? "/covenant" : "";

    async function loadRows(live) {
      // live=true: 签名者刚签完实时查——跳过快照直走聚合 API
      let staleSnapshotRows = null; // 守卫判「过期」的快照内容——仍可用作兜底下限（宁可旧、不可少）
      if (!live) {
      // 主通道: 静态快照（全站 CDN 缓存，零函数调用零上游配额；5 分钟 cron 构建，
      // 无新签名时 60 分钟心跳提交——两条提交路径都刷新 generatedAt）
      try {
        const r = await fetch(`${API_BASE}/data/signatures.json`);
        if (r.ok) {
          const j = await r.json();
          if (j && Array.isArray(j.rows)) {
            // 保活：快照 75 分钟没刷新 = 构建管线死了（心跳 60min + cron 5min + 构建余量）→ 走 API 次通道。
            // 守卫必须大于心跳间隔：空闲期快照按设计每小时才提交一次，守卫太紧会让静态主通道被永久架空（1011 教训）
            const age = j.generatedAt ? Date.now() - new Date(j.generatedAt).getTime() : Infinity;
            if (age < 75 * 60 * 1000) return j.rows; // 空数组=真空名单，同样是合法快照
            staleSnapshotRows = j.rows; // 年龄超窗但内容有效：留作兜底下限参照（1009 名单缺员事故）
          }
        }
      } catch (_) { /* 快照不可用 → 次通道 */ }
      }

      // 数据不可退化守卫：兜底通道给的行数若少于最近已知快照 → 判上游陈旧/残缺
      // （jsDelivr 幽灵清单给旧文件集、GitHub 限流给空集），弃用兜底、回退快照旧数据——
      // 名单宁可显示旧的完整版，不可悄悄少人（1009 事故：4 人名单短暂显示成 2 条幽灵记录）
      const noShrink = (candidate) => {
        if (!staleSnapshotRows || !staleSnapshotRows.length) return candidate;
        return candidate.length >= staleSnapshotRows.length ? candidate : staleSnapshotRows;
      };

      // 次通道: 同源聚合 API（边缘缓存，动态兜底——快照刚更新间隙/构建故障时）
      const rows = new Map();
      const key = (x) => x.emailHash || x.name + "|" + (x.confirmedAt || "");
      try {
        const r = await fetch(`${API_BASE}/api/list${live ? "?live=1" : ""}`); // live 时绕过服务端进程缓存
        if (!r.ok) throw new Error(r.status);
        const j = await r.json();
        for (const x of j.rows || []) rows.set(key(x), x);
        return noShrink(Array.from(rows.values())); // 200 即健康：0 条=真空名单（端点自身已区分 502 与 200 空，页面不再重复判空）
      } catch (_) { /* 同源 API 不可用 → 走直连兜底 */ }

      async function loadCdn() {
        const r = await fetch(`${CDN_LIST}?t=${Date.now()}`);
        if (!r.ok) throw new Error(r.status);
        const pkg = await r.json();
        const PREFIX = '/signatures/verified/';
        const names = (pkg.files || [])
          .filter((f) => f.name.startsWith(PREFIX) && f.name.endsWith(".json")) // 必须锚定前缀：replace() 会放过 data/signatures.json 等全仓 .json → 必 404 → 整通道报废
          .map((f) => f.name.slice(PREFIX.length));
        if (!names.length) return []; // 清单无签名文件=真空名单（合法），非通道故障
        // 幽灵清单防护（与服务端 cdn-ghost-listing 对齐，1009 事故）：jsDelivr data API
        // 对 @main 的清单缓存刷新极懒（实测 9 天前的已删文件仍在列）——清单列出的
        // 文件可能早已不存在。逐文件判 ok，全部 404 = 幽灵清单 → 判通道死亡走 GitHub；
        // 404 响应体是纯文本，不先判 ok 直接 .json() 必炸 SyntaxError。
        const results = await Promise.all(names.map(async (n) => {
          const r2 = await fetch(`${CDN}/${n}?t=${Date.now()}`);
          if (!r2.ok) return null;
          return await r2.json().catch(() => null);
        }));
        const alive = results.filter(Boolean);
        if (!alive.length) throw new Error("cdn-ghost-listing");
        return alive;
      }
      async function loadGithub() {
        const r = await fetch(`${LIST_API}&t=${Date.now()}`, { headers: { Accept: "application/vnd.github+json" } });
        if (!r.ok) throw new Error(r.status);
        const files = (await r.json()).filter((x) => x.type === "file" && x.name.endsWith(".json"));
        return await Promise.all(files.map(async (f) => {
          const j = await (await fetch(`${RAW}/${f.name}?t=${Date.now()}`)).json();
          return j;
        }));
      }

      let anyAlive = false; // 通道成活与行数解耦：0 条 + 有通道活着 = 真空名单（1011 修复：不再误报 both-empty）
      try {
        for (const x of await loadCdn()) rows.set(key(x), x);
        anyAlive = true;
      } catch (_) { /* CDN 挂了走纯 GitHub */ }
      try {
        for (const x of await loadGithub()) rows.set(key(x), x);
        anyAlive = true;
      } catch (_) { /* 限流时 CDN 结果仍完整可用 */ }
      if (!anyAlive) throw new Error("both-empty");
      return noShrink(Array.from(rows.values())); // 空数组=真空名单，合法态；退化守卫兜底
    }

    // ---- 名单缓存层（9-30 性能改版：定时刷新替代逐访实时拉取）----
    // localStorage 秒开旧名单，TTL 5 分钟；页面常驻时每 5 分钟自动刷新；
    // 切回标签页时若已过期立即刷新。失败且有旧缓存 → 保留旧数据不报错。
    const LIST_TTL = 5 * 60 * 1000;
    const CACHE_KEY = "covenant-list";
    function readCache() {
      try {
        const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
        if (c && c.at && Array.isArray(c.rows)) return c;
      } catch (_) {}
      return null;
    }
    function writeCache(rows) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), rows })); } catch (_) {}
    }
    function fmtTime(ts) {
      const d = new Date(ts);
      return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
    }
    function showUpdated(at) {
      const el = document.getElementById("updated-at");
      if (el) el.textContent = "· " + T("listUpdated") + fmtTime(at);
    }
    function render(rows, at) {
      rows.sort((a, b) => (b.confirmedAt || "").localeCompare(a.confirmedAt || ""));
      document.getElementById("rows").innerHTML = rows.map((x) => {
        const commitLink = x.emailHash
          ? `https://github.com/${REPO}/commits/main/signatures/verified/${encodeURIComponent(x.emailHash)}.json`
          : null;
        const date = esc((x.confirmedAt || "").slice(0, 10));
        return `
          <tr><td>${esc(x.name)}</td><td>${esc(x.institution || "—")}</td><td>${esc(x.role || "")}</td><td>${commitLink ? `<a href="${commitLink}" target="_blank" rel="noopener" title="${esc(T("verifyHint"))}" aria-label="${esc(T("verifyHint"))}">${date} ↗</a>` : date}</td></tr>
        `;}).join("");
      document.getElementById("count").textContent = rows.length;
      document.getElementById("loading").style.display = "none"; // display 控制：i18n 重排 data-i18n 文案也不会顶回来
      showUpdated(at);
    }
    const FRESH = new URLSearchParams(location.search).get("fresh") === "1"; // 从签署成功页「查看名单」进入：签名者本人，实时拉
    async function refreshList() {
      const c = FRESH ? null : readCache();
      const fresh = c && Date.now() - c.at < LIST_TTL;
      if (c) render(c.rows, c.at); // 缓存秒开（哪怕过期也先显示旧的）
      if (fresh) return;
      try {
        const rows = await loadRows(FRESH);
        render(rows, Date.now());
        writeCache(rows);
      } catch (_) {
        if (!c) { const l = document.getElementById("loading"); l.style.display = ""; l.textContent = T("listLoadFail"); } // 无任何数据才报错
      }
    }
    refreshList();
    setInterval(function () { if (!document.hidden) refreshList(); }, LIST_TTL); // 常驻页面定时刷新
    document.addEventListener("visibilitychange", function () { if (!document.hidden) refreshList(); }); // 切回标签页重查
    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
  </script>
