<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-title>已签署名单 · 《智慧生命要尽量少占资源》</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; line-height: 1.8; color: #111; }
  h1 { font-size: 1.4em; }
  .lang-switch { position: absolute; top: 16px; right: 20px; font-size: 0.85em; }
  .lang-switch button { background: none; border: 1px solid #6a1b9a; color: #6a1b9a; border-radius: 4px; padding: 3px 10px; cursor: pointer; width: auto; font-weight: 400; }
  table { width: 100%; border-collapse: collapse; margin-top: 24px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #eee; font-size: 0.95em; }
  th { color: #666; font-weight: 600; }
  .count { color: #6a1b9a; font-weight: 600; }
  .muted { color: #666; font-size: 0.9em; }
  a { color: #6a1b9a; }
</style>
<script>
(function () {
  var base = location.pathname.indexOf("/covenant") === 0 ? "/covenant" : "";
  (function () {
    var sc = document.createElement("script");
    sc.src = base + "/i18n.js";
    document.head.appendChild(sc);
  })();
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll('a[data-int="1"]').forEach(function (a) {
      a.setAttribute("href", a.getAttribute("href").replace("LINKBASE", base));
    });
  });
})();
</script>
</head>
<body>
  <div class="lang-switch"><button onclick="covenantI18n.langSwitch(covenantI18n.lang==='zh'?'en':'zh')">EN / 中</button></div>
  <h1 data-i18n>listTitle</h1>
  <p class="muted"><span data-i18n>listDesc</span> <span id="loading" data-i18n>listLoading</span></p>
  <table>
    <thead><tr><th data-i18n>thName</th><th data-i18n>thInst</th><th data-i18n>thRole</th><th data-i18n>thDate</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p class="muted" style="margin-top:32px"><span data-i18n>listCountPre</span> <span class="count" id="count">…</span> <span data-i18n>listCountPost</span> · <a href="LINKBASE/index.html" data-int="1" data-i18n>iSign</a> · <a href="LINKBASE/charter.html" data-int="1" data-i18n>pageTitle</a></p>

  <script>
    var T = function (k) { return window.covenantI18n ? covenantI18n.t(k) : k; };
    // 双通道: CDN 稳定底座（秒开, 最多滞后12h）+ GitHub API 实时增量（新签名立即可见）
    const REPO = "symy-ai/covenant";
    const CDN = `https://cdn.jsdelivr.net/gh/${REPO}@main/signatures/verified`;
    const CDN_LIST = `https://data.jsdelivr.com/v1/packages/gh/${REPO}@main?structure=flat`;
    const RAW = `https://raw.githubusercontent.com/${REPO}/main/signatures/verified`;
    const LIST_API = `https://api.github.com/repos/${REPO}/contents/signatures/verified?ref=main`;

    async function loadRows() {
      const rows = new Map();
      const key = (x) => x.emailHash || x.name + "|" + (x.confirmedAt || "");

      async function loadCdn() {
        const r = await fetch(`${CDN_LIST}?t=${Date.now()}`);
        if (!r.ok) throw new Error(r.status);
        const pkg = await r.json();
        const names = pkg.files
          .map((f) => f.name.replace('/signatures/verified/', ''))
          .filter((n) => n.endsWith(".json"));
        if (!names.length) throw new Error("empty");
        return await Promise.all(names.map(async (n) => {
          const j = await (await fetch(`${CDN}/${n}?t=${Date.now()}`)).json();
          return j;
        }));
      }
      async function loadGithub() {
        const r = await fetch(`${LIST_API}&t=${Date.now()}`, { headers: { Accept: "application/vnd.github+json" } });
        if (!r.ok) throw new Error(r.status);
        const files = (await r.json()).filter((x) => x.type === "file" && x.name.endsWith(".json"));
        return await Promise.all(files.map(async (f) => {
          const j = await (await fetch(`${RAW}/${f.name}?t=${Date.now()}`)).json();
          return j;
        }));
      }

      try {
        for (const x of await loadCdn()) rows.set(key(x), x);
      } catch (_) { /* CDN 挂了走纯 GitHub */ }
      try {
        for (const x of await loadGithub()) rows.set(key(x), x);
      } catch (_) { /* 限流时 CDN 结果仍完整可用 */ }
      if (!rows.size) throw new Error("both-empty");
      return Array.from(rows.values());
    }

    (async () => {
      try {
        const rows = await loadRows();
        rows.sort((a, b) => (b.confirmedAt || "").localeCompare(a.confirmedAt || ""));
        document.getElementById("rows").innerHTML = rows.map((x) => `
          <tr><td>${esc(x.name)}</td><td>${esc(x.institution || "—")}</td><td>${esc(x.role || "")}</td><td>${(x.confirmedAt || "").slice(0, 10)}</td></tr>
        `).join("");
        document.getElementById("count").textContent = rows.length;
        document.getElementById("loading").textContent = "";
      } catch (_) {
        document.getElementById("loading").textContent = T("listLoadFail");
      }
    })();
    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
  </script>
</body>
</html>
